# Non-secret configuration. Copy to config.yaml and fill in the real values.
# Secrets (TELEGRAM_BOT_TOKEN, T6_API_SECRET) go in .env, never here.
#
# Every key is validated at startup; a bad or unknown key fails the boot.
# Values marked FILL IN are placeholders the service must not run with.

# --- Telegram intake (#18) ---
intake_chat_id: -1000000000000      # FILL IN: the intake supergroup's chat id
intake_topic_id: 2                  # FILL IN: the intake forum topic's message_thread_id
captured_reaction: "👍"             # pick from the list smoke.py prints
flagged_reaction: "🤔"              # captured with any finding; also from that list

# --- Telegram transport (#95) ---
telegram_mode: direct               # direct = poll Telegram with TELEGRAM_BOT_TOKEN;
                                    # gateway = read and post through the Sixto gateway
gateway_url: null                   # gateway mode only, e.g. "http://gateway.example:8780"

# --- Polling (#18) ---
poll_timeout: 50                    # Telegram long-poll timeout (seconds, max 50)
poll_interval: 1.0                  # pause between poll+drain cycles (seconds)

# --- Ledger (#18) ---
ledger_path: "./data/ledger.db"     # the container uses /app/data (a named volume)

# --- Classify/extract through the t6 API (`llm run`) ---
llm_model_hint: "deepseek-chat"     # the API's provider model; the "latest" alias, never a dated pin
llm_timeout_seconds: 70             # at least 70: the API waits up to 60 s for the provider

# --- Filter before extraction (#153) ---
# Which t6-core filter rule (`llm filter`) applies to which chat and topic. Only the rule's name
# is here; its question and thresholds live in t6-core. Left out, the intake topic is filtered
# with `job_order`; `filters: []` filters nothing.
# To name entries: filters: [{chat_id: -1000000000000, topic_id: 2, rule: job_order}]
filters: null
# Count first: false stores the verdict and still extracts every message. Read
# `python -m jo_watchdog.app filter-report` (drop against jo) before setting true.
filter_drops: false

# --- Job Orders (#134, #151) ---
# The Department rules (aliases, live options) run in the t6 API (T6_DEPARTMENT_ALIASES there).
# An old department_aliases key still boots and is ignored.
raise_poll_seconds: 60              # how long to wait for the page of a raised Job Order

# --- Resolution and caches (#22) ---
# The standing cc on every Job Order is added by the t6 API (T6_STANDING_CC there).
cache_refresh_hours: 6
cache_stale_alert_hours: 24

# --- Ops reporting (#23) ---
ops_chat_id: -1000000000001         # FILL IN: the ops supergroup's chat id
ops_topic_id: 3                     # FILL IN: the ops forum topic's message_thread_id
standing_cc_telegram_handle: "@standing_cc_handle"  # FILL IN
header_date_tolerance_days: 1
message_gap_alerts: true           # alert when intake chat message ids skip (#101)

# --- Reliability and heartbeat (#25) ---
owner_telegram_handle: "@owner_handle"        # FILL IN
retry_schedule_seconds: [30, 120, 300, 600]  # delays between attempts: five attempts in all
deadman_stale_minutes: 10
heartbeat_time: "07:00"
timezone: "Asia/Manila"

# --- Deliverable matching through the t6 API's `llm decide` (#26, #147) ---
t_link: 0.90
t_hint: 0.50
deliverable_link_enabled: false     # shadow mode until the owner turns it on

# --- Rollback control (#27) ---
dry_run: false                      # true = stop at `planned`, post the plan, write nothing
