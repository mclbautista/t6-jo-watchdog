# Public repo safety checks from t6-core (mclbautista/t6-core#27, this repo #104): secrets, forbidden paths
# (.env, config.yaml, data/, *.db) and real client, show or person names.
# Needs the T6_NAMES_DENYLIST Actions secret; without it the check fails closed.
# Run it by hand (Actions > Public repo safety > Run workflow) for a full-history scan.
name: Public repo safety

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full-history:
        description: Scan every commit for secrets
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  safety:
    # Both pins are the t6-core commit that the pyproject pin uses; the v0.6.6 tag replaces them
    # in one PR once it exists.
    uses: mclbautista/t6-core/.github/workflows/public-repo-safety.yml@2208348ae94a5ba6414412bd888e645afa4f1c65
    with:
      t6-core-ref: 2208348ae94a5ba6414412bd888e645afa4f1c65
      full-history: ${{ github.event_name == 'workflow_dispatch' && inputs.full-history }}
    secrets:
      T6_NAMES_DENYLIST: ${{ secrets.T6_NAMES_DENYLIST }}
