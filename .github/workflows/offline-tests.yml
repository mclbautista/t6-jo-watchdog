name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: t6 admin consumer-check .
      - run: python -m pytest -q
        env:
          LOGNAME: staging
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -t jo-watchdog:ci .
      - run: docker run --rm --entrypoint python jo-watchdog:ci -c "import jo_watchdog.app, t6.client"
